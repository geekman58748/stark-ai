<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stark AI — hellostark.xyz</title>
  <meta name="description" content="Stark AI. Intelligence, deployed." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  <meta property="og:title" content="Stark AI" />
  <meta property="og:description" content="Intelligence, deployed." />
  <meta property="og:type" content="website" />
  <style>
    :root {
      --bg: #0a0b0f;
      --fg: #e8eaf0;
      --muted: #8b91a3;
      --accent: #6ea8ff;
      --accent-2: #a07bff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(40rem 40rem at 30% 20%, rgba(110, 168, 255, 0.14), transparent 60%),
        radial-gradient(35rem 35rem at 75% 80%, rgba(160, 123, 255, 0.12), transparent 60%);
      pointer-events: none;
    }
    main { position: relative; max-width: 40rem; }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      margin-bottom: 1.6rem;
    }
    h1 {
      font-size: clamp(2.6rem, 8vw, 4.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      background: linear-gradient(120deg, var(--fg) 30%, var(--accent) 65%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.tagline {
      margin-top: 1.1rem;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--muted);
      line-height: 1.6;
    }
    .cta {
      margin-top: 2.4rem;
      display: inline-block;
      padding: 0.85rem 1.8rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #0a0b0f;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(110, 168, 255, 0.25);
    }
    footer {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <span class="badge">Stark AI</span>
    <h1>Intelligence, deployed.</h1>
    <p class="tagline">
      Stark AI is on the way. Something sharp is coming to
      <strong>hellostark.xyz</strong>.
    </p>
    <a class="cta" href="mailto:hello@hellostark.xyz">Get in touch</a>
  </main>
  <footer>&copy; 2026 Stark AI · <a href="https://hellostark.xyz">hellostark.xyz</a></footer>
</body>
</html>
