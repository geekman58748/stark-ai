[package]
name = "stark-vault"
version = "0.1.0"
edition = "2021"
description = "Stark bill-payment vault: spending caps, meter allowlist, owner withdraw"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# near-sdk 5 refuses a plain host compile unless it can tell this is not an
# on-chain build. Wasm builds (via `cargo near build`) take the wasm branch;
# `cargo test` on the host takes the non-wasm branch with unit-testing on.
[target.'cfg(target_family = "wasm")'.dependencies]
near-sdk = "5.29.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }

# Money contract settings: never overflow silently, keep the wasm small.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.dev]
overflow-checks = true
